name: Release Workflow

on:
  pull_request_target:
    types: [closed]
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: read
  packages: write

jobs:
  run-release-tool:
    if: github.event.pull_request.merged == true
    uses: Kareadita/GitHubActions/.github/workflows/release-tools.base.yml@main
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    with:
      config-path: release.yaml
