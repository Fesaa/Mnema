
<div class="m-3" *transloco="let t; prefix: 'dropped-content'">

  <div class="m-2">
    <h4>{{t('title')}}</h4>
    <span class="text-muted">
      {{t('description')}}
    </span>
  </div>

  <div class="my-4">
    @if (typeaheadConfig(); as config) {
      <app-type-ahead [settings]="config" (selectedData)="monitoredSeriesId.set($any($event).id)">
        <ng-template #label let-ms>
          {{t('monitored-series-selector-label')}}
        </ng-template>
        <ng-template #optionItem let-ms>
          {{ms.title}}
        </ng-template>
        <ng-template #badgeItem let-ms>
          {{ms.title}}
        </ng-template>
      </app-type-ahead>
    }
  </div>

  <app-file-drag-and-drop-upload [acceptableExtensions]="extensions" (dropped)="onFileDrop($event)" />

  @if (uploading()) {
    <div class="mt-3">
      <div class="d-flex justify-content-between mb-1">
        <small class="fw-semibold">Uploading...</small>
        <small class="fw-semibold">{{ progress() }}%</small>
      </div>
      <div class="progress" style="height: 10px;">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated primary-bg"
          role="progressbar"
          [style.width.%]="progress()"
          [attr.aria-valuenow]="progress()"
          aria-valuemin="0"
          aria-valuemax="100">
        </div>
      </div>
    </div>
  }

  <div class="d-flex justify-content-end mt-3">
    <button class="btn btn-primary" (click)="startImport()" [disabled]="files().length == 0 || !monitoredSeriesId()">
      {{t('import')}}
    </button>
  </div>
</div>
