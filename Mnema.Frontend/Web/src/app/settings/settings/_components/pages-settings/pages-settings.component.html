<div *transloco="let t; prefix: 'settings.pages'">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap">
    <div>
      <h2 class="h2 fw-bold mb-1">{{ t('title') }}</h2>
      <p class="text-muted mb-0">{{ t('description') }}</p>
    </div>

    <button type="button" class="btn btn-primary" (click)="edit(null)">
      <i class="fa fa-plus me-2"></i>{{ t('add') }}
    </button>
  </div>

  <app-item-list
    [dragAble]="true"
    (onDrop)="drop($event)"
    [items]="pages()"
    [trackByIdFunc]="trackBy"
  >
    <ng-template #row let-item>
      <div class="d-flex align-items-center gap-3">
        <span class="fas fa-grip-lines drag-handle" cdkDragHandle aria-hidden="true"></span>

        <span class="page-icon text-center">
          <i [class]="'fa ' + item.icon"></i>
        </span>

        <a
          class="flex-grow-1"
          [routerLink]="'/page'"
          [queryParams]="{ id: item.id }"
        >
          {{ item.title }}
        </a>

        <div class="d-flex align-items-center gap-2">
          <button
            type="button"
            class="btn btn-small"
            [attr.aria-label]="t('edit-alt')"
            (click)="edit(item)"
          >
            <i class="fa fa-edit"></i>
          </button>

          <button
            type="button"
            class="btn btn-small"
            [ngbTooltip]="t('edit-defaults-tooltip')"
            [attr.aria-label]="t('edit-defaults-alt')"
            (click)="editDefaults(item)"
            [disabled]="item.modifiers.length === 0"
          >
            <i class="fa fa-pencil-alt"></i>
          </button>

          <button
            type="button"
            class="btn btn-small text-danger"
            [attr.aria-label]="t('delete-alt')"
            (click)="remove(item)"
          >
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    </ng-template>

    <ng-template #empty>
      <div class="py-5 text-center text-muted">
        <h5 class="mb-1">{{ t('empty.title') }}</h5>
        <p class="mb-0" [innerHtml]="t('empty.description')"></p>
      </div>
    </ng-template>
  </app-item-list>
</div>
