<div class="d-flex w-100 flex-grow-1 flex-column" *transloco="let t; prefix: 'settings.preferences'">

  <h2 class="h2 fw-bold mt-4 mb-3">{{ t('title') }}</h2>

  @let pref = preferences();
  @let formDefinition = preferencesFormDefinition();

  @if (pref && formDefinition) {
    <app-generic-form
      [formDefinition]="formDefinition"
      [initialValue]="pref"
      [supplyFormGroup]="preferencesForm"
    />
  }

</div>
