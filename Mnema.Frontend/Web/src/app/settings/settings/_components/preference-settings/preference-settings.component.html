<div class="d-flex w-100 flex-grow-1 flex-column" *transloco="let t; prefix: 'settings.preferences'">

  <h2 class="h2 fw-bold mt-4 mb-3">{{ t('title') }}</h2>

  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

    <div class="d-flex flex-column">
      <span class="fw-semibold">{{ t('sync-title') }}</span>
      <span class="text-muted small">{{ t('sync-description') }}</span>
    </div>

    <div class="btn-group" role="group" aria-label="Preference sync actions">
      <button type="button" class="btn btn-outline-primary" (click)="export()">
        <i class="fa-solid fa-file-export me-2"></i>{{ t('export') }}
      </button>
      <button type="button" class="btn btn-outline-primary" (click)="import()" [disabled]="importMode()">
        <i class="fa-solid fa-file-import me-2"></i>{{ t('import') }}
      </button>
    </div>

    @if (importMode()) {
      <button type="button" class="btn btn-primary" (click)="save()">
        <i class="fa-solid fa-check me-2"></i>{{ t('save') }}
      </button>
    }

  </div>

  @let pref = preferences();
  @let formDefinition = preferencesFormDefinition();

  @if (pref && formDefinition) {
    <app-generic-form
      [formDefinition]="formDefinition"
      [initialValue]="pref"
      [supplyFormGroup]="preferencesForm"
    />
  }

</div>
