<div *transloco="let t; prefix: 'settings.auth-keys'">
  <div class="d-flex justify-content-end mb-3">
    <button type="button" class="btn btn-primary" (click)="edit(null)">
      <i class="fa fa-plus me-2"></i>{{ t('add') }}
    </button>
  </div>

  <app-item-list
    [pageLoader]="pageLoader()"
    [trackByIdFunc]="trackBy"
    [reloader]="pageReloader"
  >
    <ng-template #row let-item>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="fw-semibold">{{ item.name }}</span>

        <div class="d-flex flex-wrap gap-1 flex-grow-1">
          @for (role of item.roles; track role) {
            <span class="badge bg-secondary">{{ role }}</span>
          }
          @if (item.roles.length === 0) {
            <span class="text-muted">{{ t('no-roles') }}</span>
          }
        </div>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <button
            type="button"
            class="btn btn-small"
            [attr.aria-label]="t('copy-alt')"
            (click)="copy(item)"
          >
            <i class="fa fa-clipboard"></i>
          </button>

          <button
            type="button"
            class="btn btn-small"
            [attr.aria-label]="t('edit-alt')"
            (click)="edit(item)"
          >
            <i class="fa fa-edit"></i>
          </button>

          <button
            type="button"
            class="btn btn-small text-danger"
            [attr.aria-label]="t('delete-alt')"
            (click)="remove(item)"
          >
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    </ng-template>

    <ng-template #empty>
      <div class="py-5 text-center text-muted">
        <h5 class="mb-1">{{ t('empty.title') }}</h5>
        <p class="mb-0">{{ t('empty.description') }}</p>
      </div>
    </ng-template>
  </app-item-list>
</div>
