<div *transloco="let t; prefix: 'settings.metadata-provider'">
  <p class="text-muted">{{ t('description') }}</p>

  <app-item-list
    [dragAble]="true"
    (onDrop)="drop($event)"
    [items]="sortedMetadataProviders()"
    [trackByIdFunc]="trackBy"
  >
    <ng-template #row let-provider>
      <div class="d-flex align-items-center gap-3">
        <span class="fas fa-grip-lines drag-handle" cdkDragHandle aria-hidden="true"></span>

        <button
          type="button"
          class="btn btn-link text-start p-0 flex-grow-1 fw-semibold"
          [attr.aria-expanded]="expandedProvider() === provider"
          (click)="toggle(provider)"
        >
          <span>{{ provider | metadataProvider }}</span>

          <i
            class="fa ms-auto"
            [class.fa-chevron-down]="expandedProvider() === provider"
            [class.fa-chevron-right]="expandedProvider() !== provider"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      @if (expandedProvider() === provider) {
        <div class="mt-3">
          @if (loading()) {
            <app-loading-spinner />
          } @else if (formDefinition(); as formDefinition) {
            @if (initialValue(); as initialValue) {
              @if (formGroup(); as formGroup) {
                <app-generic-form
                  [formDefinition]="formDefinition"
                  [initialValue]="initialValue"
                  [supplyFormGroup]="formGroup"
                />

                <div class="d-flex justify-content-end gap-2 mt-3">
                  <button type="button" class="btn btn-secondary" (click)="collapse()">
                    {{ t('cancel') }}
                  </button>

                  <button
                    type="button"
                    class="btn btn-primary"
                    [disabled]="!formGroup.valid"
                    (click)="save()"
                  >
                    {{ t('save') }}
                  </button>
                </div>
              }
            }
          }
        </div>
      }
    </ng-template>
  </app-item-list>
</div>
