<div *transloco="let t; prefix: 'settings.download-clients'">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap px-3 mb-3">
    <h3 class="h4 mb-0">{{ t('title') }}</h3>

    <div ngbDropdown class="d-inline-block">
      <button type="button" class="btn btn-primary" ngbDropdownToggle>
        <i class="fa fa-plus me-2"></i>{{ t('add') }}
      </button>

      <div ngbDropdownMenu>
        @for (type of freeTypes(); track type) {
          <button type="button" ngbDropdownItem (click)="edit(null, type)">
            {{ type | downloadClientType }}
          </button>
        }

        @if (freeTypes().length === 0) {
          <span class="dropdown-item-text text-muted">{{ t('all-types-in-use') }}</span>
        }
      </div>
    </div>
  </div>

  <app-item-list
    [pageLoader]="pageLoader()"
    [trackByIdFunc]="trackBy"
    [reloader]="pageReloader"
  >
    <ng-template #row let-item>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="fw-semibold">{{ item.name }}</span>
        <span class="badge bg-secondary">{{ item.type | downloadClientType }}</span>

        @if (item.isFailed) {
          <span class="badge bg-warning text-dark">{{ t('locked') }}</span>
        }

        <div class="d-flex align-items-center gap-2 ms-auto">
          <button
            type="button"
            class="btn btn-small"
            [attr.aria-label]="t('edit-alt')"
            (click)="edit(item)"
          >
            <i class="fa fa-edit"></i>
          </button>

          <button
            type="button"
            class="btn btn-small"
            [attr.aria-label]="t('release-lock-alt')"
            (click)="releaseLock(item)"
            [disabled]="!item.isFailed"
          >
            <i class="fa {{item.isFailed ? 'fa-lock' : 'fa-lock-open'}}"></i>
          </button>

          <button
            type="button"
            class="btn btn-small text-danger"
            [attr.aria-label]="t('delete-alt')"
            (click)="remove(item)"
          >
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    </ng-template>

    <ng-template #empty>
      <div class="py-5 text-center text-muted">
        <h5 class="mb-1">{{ t('empty.title') }}</h5>
        <p class="mb-0" [innerHtml]="t('empty.description')"></p>
      </div>
    </ng-template>
  </app-item-list>
</div>
