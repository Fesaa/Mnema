<div class="d-flex w-100 flex-grow-1 flex-column" *transloco="let t; prefix: 'settings.server'">
  <h2 class="h2 fw-bold mb-3">{{ t('title') }}</h2>
  <p class="text-muted mb-0">{{ t('description') }}</p>

  <section class="mt-4">
    <h3 class="h4">{{ t('general') }}</h3>
    @if (serverSettingsFormDefinition(); as formDefinition) {
      <app-generic-form
        [formDefinition]="formDefinition"
        [supplyFormGroup]="serverSettingsForm"
        [initialValue]="settingsService.config()"
      />
    }
  </section>

  <section class="mt-5">
    <h3 class="h4">{{ t('auth-keys') }}</h3>
    <app-auth-keys />
  </section>
</div>
