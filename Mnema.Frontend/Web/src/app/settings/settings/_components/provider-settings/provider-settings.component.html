<div *transloco="let t; prefix: 'settings.providers'">
  <app-item-list
    [items]="InUseProviders"
    [trackByIdFunc]="trackBy"
  >
    <ng-template #row let-provider>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold flex-grow-1">{{ provider | providerName }}</span>

        <button
          type="button"
          class="btn btn-small"
          [attr.aria-expanded]="expandedProvider() === provider"
          (click)="toggle(provider)"
        >
          {{ t('configure') }}
          <i
            class="fa"
            [class.fa-chevron-down]="expandedProvider() === provider"
            [class.fa-chevron-right]="expandedProvider() !== provider"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      @if (expandedProvider() === provider) {
        <div class="mt-3">
          @if (loading()) {
            <app-loading-spinner />
          } @else if (formDefinition(); as formDefinition) {
            @if (initialValue(); as initialValue) {
              @if (formGroup(); as formGroup) {
                <app-generic-form
                  [formDefinition]="formDefinition"
                  [initialValue]="initialValue"
                  [supplyFormGroup]="formGroup"
                />

                <div class="d-flex justify-content-end gap-2 mt-3">
                  <button type="button" class="btn btn-secondary" (click)="collapse()">
                    {{ t('cancel') }}
                  </button>

                  <button
                    type="button"
                    class="btn btn-primary"
                    [disabled]="!formGroup.valid"
                    (click)="save(provider)"
                  >
                    {{ t('save') }}
                  </button>
                </div>
              }
            }
          }
        </div>
      }
    </ng-template>
  </app-item-list>
</div>
