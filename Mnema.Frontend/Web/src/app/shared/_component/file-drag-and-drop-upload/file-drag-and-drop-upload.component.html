<ng-container *transloco="let t; prefix: 'file-drag-and-drop-upload'">
  <ngx-file-drop
    (onFileDrop)="onFileDrop($event)"
    [accept]="acceptableExtensions()"
    [directory]="directory()"
    dropZoneClassName="upload-zone"
    contentClassName="upload-zone-content">

    <ng-template ngx-file-drop-content-tmp let-openFileSelector="openFileSelector">

      <!-- Upload Controls Container -->
      <div class="upload-controls w-100 p-4">
        @switch (uploadMode()) {
          @case (UploadMode.Url) {
            <div class="row g-2 align-items-center justify-content-center">
              <div class="col-12 col-md-8">
                <div class="input-group">
                  <label class="input-group-text bg-body-tertiary" for="load-url">
                    {{ t('url-label') }}
                  </label>
                  <input type="text"
                         [formField]="formGroup"
                         autofocus
                         autocomplete="off"
                         class="form-control"
                         placeholder="https://"
                         id="load-url"
                         (keyup.enter)="handleUrlUpload()">
                  <button class="btn btn-primary"
                          type="button"
                          (click)="handleUrlUpload()"
                          [disabled]="formGroup().invalid()">
                    {{ t('load') }}
                  </button>
                </div>
              </div>

              <div class="col-auto">
                <button class="btn btn-outline-secondary"
                        type="button"
                        (click)="setMode(showUrlUpload() ? UploadMode.All : UploadMode.Files)">
                  <i class="fas fa-arrow-left me-1" aria-hidden="true"></i>
                  <span>{{ t('back') }}</span>
                </button>
              </div>
            </div>
          }

          @default {
            <div class="text-center">
              <div class="upload-icon-wrapper mb-2">
                <i class="fa fa-cloud-upload-alt icon-upload" aria-hidden="true"></i>
              </div>

              <div class="d-flex justify-content-center align-items-center flex-wrap gap-2 text-secondary">
                @if (showUrlUpload()) {
                  <button type="button" class="btn btn-link p-0 text-decoration-none" (click)="setMode(UploadMode.Url)">
                    <span class="phone-hidden">{{ t('enter-an-url-pre-title', { url: urlText() ?? t('url') }) }}</span>
                  </button>
                  <span class="dot-separator">•</span>
                }

                <span class="fw-medium text-dark">{{ t('drag-n-drop') }}</span>
                <span class="dot-separator">•</span>

                <button type="button" class="btn p-0 text-decoration-none fw-semibold" (click)="openFileSelector()">
                  {{ t('upload') }}
                  @if (uploadText(); as text) {
                    <span class="phone-hidden ms-1">{{ text }}</span>
                  }
                </button>
              </div>
            </div>
          }
        }
      </div>

      @if (files().length > 0) {
        <div class="file-list-container w-100 border-top p-3 bg-body-tertiary">
          <div class="small fw-bold text-muted text-uppercase mb-2 tracking-wide">
            {{t('selected-files', { count: files().length })}}
          </div>

          <div class="d-flex flex-column gap-2">
            @for (file of files(); track file.relativePath) {
              <div class="file-item d-flex align-items-center justify-content-between p-2 bg-body rounded border">
                <div class="d-flex align-items-center text-truncate me-2">
                  <i class="fa fa-file-alt text-primary fs-5 me-2" aria-hidden="true"></i>
                  <span class="text-truncate small fw-medium">{{ file.fileEntry.name }}</span>
                </div>
              </div>
            }
          </div>
        </div>
      }

    </ng-template>
  </ngx-file-drop>
</ng-container>
