<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mnema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Primary Colors (Deep Purple-Pink) */
            --primary-color: #7e3a59;
            --primary-color-light: #a25e82;
            --primary-color-lighter: #cba3b8;

            /* Secondary Colors (Teal) */
            --secondary-color: #3a7c7c;
            --secondary-color-light: #659d9d;
            --secondary-color-lighter: #9cc8c8;

            /* Background Colors */
            --background-color: #f9fafb;
            --background-secondary: #e3e8e8;
            --background-accent: #d0d8d8;

            /* Text Colors */
            --text-primary: #1c1c1c;
            --text-secondary: #5a5a5a;
            --text-light: #f4f4f5;
            --text-accent: #7e3a59;

            /* Surface Colors */
            --surface-card: #ffffff;
            --surface-hover: #f3e6eb;
            --surface-border: #c1cece;

            /* Shadows */
            --shadow-light: rgba(28, 28, 28, 0.05);
            --shadow-medium: rgba(28, 28, 28, 0.1);
            --shadow-dark: rgba(28, 28, 28, 0.2);

            /* Alerts */
            --error-color: #a54242;
            --error-color-light: #cd7a7a;
            --warning-color: #c29d2d;
            --warning-color-light: #d9bc5a;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            background:
                    radial-gradient(circle at 12% 8%, var(--primary-color-lighter) 0%, transparent 38%),
                    radial-gradient(circle at 88% 92%, var(--secondary-color-lighter) 0%, transparent 42%),
                    var(--background-color);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .scene {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wordmark {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 32px;
            letter-spacing: 0.01em;
            margin: 0;
            color: var(--text-primary);
        }

        .tagline {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 6px 0 32px;
            text-align: center;
        }

        .card {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 30px var(--shadow-light);
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .field-row {
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 12px 14px;
            border-radius: 9px;
            border: 1.5px solid var(--surface-border);
            background: var(--background-color);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        input[type="password"]:focus {
            border-color: var(--primary-color-light);
            background: var(--surface-card);
            box-shadow: 0 0 0 3px var(--primary-color-lighter);
        }

        input[type="password"]:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .error-banner {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--error-color);
            background: color-mix(in srgb, var(--error-color-light) 18%, transparent);
            border: 1px solid var(--error-color-light);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 18px;
        }

        .error-banner.visible { display: flex; }

        button[type="submit"] {
            width: 100%;
            margin-top: 18px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-light);
            background: var(--primary-color);
            border: none;
            border-radius: 9px;
            padding: 13px 14px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover { background: var(--primary-color-light); }
        button[type="submit"]:active { transform: scale(0.98); }
        button[type="submit"]:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

        button[type="submit"]:disabled {
            background: var(--background-accent);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .footnote {
            margin-top: 22px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="scene">
    <h1 class="wordmark">Mnema</h1>

    <div class="card">
        <form id="loginForm" method="post" action="/api/Auth/login" novalidate>
            <div id="errorBanner" class="error-banner" role="alert">
                <span id="errorText">Wrong password. Try again.</span>
            </div>

            <label class="field-label" for="password">Password</label>
            <div class="field-row">
                <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
            </div>

            <input type="hidden" name="returnUrl" id="returnUrl" value="" />

            <button type="submit" id="submitBtn">Unlock</button>
        </form>
    </div>

    <p class="footnote">Self-hosted with Mnema</p>
</div>

<script>
    // Carry ReturnUrl through so a redirected request lands back where the user came from
    var params = new URLSearchParams(window.location.search);
    var returnUrl = params.get('ReturnUrl') || params.get('returnUrl');
    if (returnUrl) document.getElementById('returnUrl').value = returnUrl;

    // Show the error banner if we were bounced back here after a failed attempt
    if (params.get('error')) {
        document.getElementById('errorBanner').classList.add('visible');
    }

    // Disable the button on submit so a slow network doesn't invite a double-post
    document.getElementById('loginForm').addEventListener('submit', function () {
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Unlocking…';
    });
</script>

</body>
</html>
